name = "gelz-store-api"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
[vars]
STORE_ORIGIN = "https://gelz.tech"
PAYMENTS_ENABLED = "false"
MP_SANDBOX = "true"
ME_SANDBOX = "true"
NOTIFICATIONS_ENABLED = "false"
# Set API_ORIGIN, ORIGIN_CEP, SUPABASE_URL, SUPABASE_ANON_KEY and MP_PUBLIC_KEY in dashboard.
# Bind D1 as DB in dashboard, or add [[d1_databases]] with the actual database_id before CLI deploy.
[triggers]
crons = ["*/5 * * * *"]
[observability]
enabled = true
