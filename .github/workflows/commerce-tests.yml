name: Store commerce tests
on:
  push:
    paths: ['store/**', '.github/workflows/commerce-tests.yml']
  pull_request:
    paths: ['store/**', '.github/workflows/commerce-tests.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test store/tests/*.test.mjs
      - run: find store -name '*.js' -print0 | xargs -0 -n1 node --check
