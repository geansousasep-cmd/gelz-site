name: Validar GELZ Prospect
on:
  pull_request:
    paths:
      - 'prospect/**'
      - '.github/workflows/prospect-ci.yml'
  push:
    branches: [feature/gelz-prospect-premium, fix/prospect-cnpj-core]
    paths:
      - 'prospect/**'
      - '.github/workflows/prospect-ci.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate frontend JavaScript
        run: |
          node --check prospect/assets/app.js
          node --check prospect/assets/cnpj-engine.js
          node --check prospect/assets/capture.js
      - name: Run Prospect smoke tests
        run: node --test prospect/tests/smoke.test.mjs prospect/tests/capture.test.mjs
      - name: Browser E2E navigation and live CNPJ capture
        run: node prospect/tests/browser-smoke.mjs
      - name: Probe public CNPJ API and CORS (non-blocking)
        continue-on-error: true
        run: |
          curl -sS --max-time 12 -D /tmp/fichario_headers -o /tmp/fichario_response -H "Origin: https://gelz.tech" "https://fichario.app/api/v1/cnpj/07396951000170"
          grep -iE "^(HTTP/|access-control-allow-origin:|content-type:)" /tmp/fichario_headers || true
          head -c 300 /tmp/fichario_response || true
          echo
          echo "---- VERIFICACAO: BUSCA SETOR / CIDADE ----"
          curl -sS --max-time 16 -D /tmp/fichario_sector_h -o /tmp/fichario_sector             -H "Origin: https://gelz.tech"             "https://fichario.app/api/v1/busca-avancada?uf=SP&cidade=Sao%20Paulo&cnae=6920601&por_pagina=3&pagina=1"
          grep -iE "^(HTTP/|access-control-allow-origin:|content-type:)" /tmp/fichario_sector_h || true
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/fichario_sector","utf8"));console.log("SECTOR_KEYS",Object.keys(d),"ARRAY_LENGTH",Array.isArray(d.resultados)?d.resultados.length:Array.isArray(d.empresas)?d.empresas.length:"outro");console.log("FIRST_FIELDS",Object.keys((d.resultados||d.empresas||[])[0]||{}))'
          echo "---- VERIFICACAO: BUSCA NOME ----"
          curl -sS --max-time 16 -D /tmp/fichario_name_h -o /tmp/fichario_name             -H "Origin: https://gelz.tech"             "https://fichario.app/api/v1/busca?q=petrobras&uf=RJ"
          grep -iE "^(HTTP/|access-control-allow-origin:|content-type:)" /tmp/fichario_name_h || true
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/fichario_name","utf8"));console.log("NAME_KEYS",Object.keys(d),"ARRAY_LENGTH",Array.isArray(d.resultados)?d.resultados.length:"outro")'
