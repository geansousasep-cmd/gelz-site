name: Validar GELZ Prospect
on:
  pull_request:
    paths:
      - 'prospect/**'
      - '.github/workflows/prospect-ci.yml'
  push:
    branches: [feature/gelz-prospect-premium]
    paths:
      - 'prospect/**'
      - '.github/workflows/prospect-ci.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate frontend JavaScript
        run: node --check prospect/assets/app.js
      - name: Run Prospect smoke tests
        run: node --test prospect/tests/smoke.test.mjs
